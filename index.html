<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col">

    <!-- Layar Login Awal -->
    <div id="login-screen" class="absolute inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <h1 class="text-2xl font-bold mb-4">Persiapan Ujian</h1>
        <input id="student-name" type="text" placeholder="Masukkan Nama Lengkap" class="border p-2 mb-4 w-64 rounded text-center">
        <button id="start-btn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Mulai Ujian & Aktifkan Kamera</button>
        <p id="error-msg" class="text-red-500 mt-2 text-sm hidden">Mohon izinkan akses kamera untuk memulai.</p>
    </div>

    <!-- Kamera Mini (Indikator untuk siswa) -->
    <div class="absolute top-2 right-2 w-32 bg-black rounded shadow-lg z-40 border-2 border-white">
        <video id="webcam" autoplay playsinline muted class="w-full h-auto rounded"></video>
        <div class="text-xs text-white text-center bg-red-600 font-bold">DIAWASI</div>
    </div>
    
    <canvas id="canvas" class="hidden"></canvas>

    <!-- Tempat Google Form -->
    <iframe id="exam-frame" class="w-full h-full flex-grow border-none" src=""></iframe>

    <script>
        // MASUKKAN API KEY ABLY ANDA DI SINI
        const ABLY_API_KEY = 'GANTI_DENGAN_API_KEY_ABLY_ANDA';
        // MASUKKAN LINK GOOGLE FORM ANDA DI SINI (Pastikan tidak perlu login Google)
        const GOOGLE_FORM_URL = 'GANTI_DENGAN_LINK_GOOGLE_FORM_ANDA';

        const ably = new Ably.Realtime(ABLY_API_KEY);
        const channel = ably.channels.get('exam-room');
        
        let studentName = "";
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        document.getElementById('start-btn').addEventListener('click', async () => {
            const nameInput = document.getElementById('student-name').value.trim();
            if (!nameInput) return alert('Nama harus diisi!');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                studentName = nameInput;
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('exam-frame').src = GOOGLE_FORM_URL;
                
                // Mulai kirim foto setiap 15 detik
                setInterval(sendSnapshot, 15000);
                sendSnapshot(); // Kirim langsung saat mulai
            } catch (err) {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        function sendSnapshot() {
            if (!studentName) return;
            
            // Kompresi ukuran gambar agar sangat ringan (160x120px, kualitas 0.4)
            canvas.width = 160;
            canvas.height = 120;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.4);

            channel.publish('snapshot', { name: studentName, image: imageData });
        }

        // Deteksi jika siswa beralih tab atau minimize browser
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && studentName) {
                channel.publish('violation', { name: studentName, type: 'Pindah Tab / Minimize' });
                // Segera kirim foto bukti saat pelanggaran
                sendSnapshot();
            }
        });
    </script>
</body>
</html>
