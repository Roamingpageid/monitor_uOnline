<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengawas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Live Pengawas Ujian</h1>
            <div class="bg-green-100 text-green-800 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                Terkoneksi
            </div>
        </div>

        <!-- Grid untuk menampilkan wajah siswa -->
        <div id="student-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Kartu siswa akan muncul di sini secara otomatis -->
        </div>
    </div>

    <script>
        // MASUKKAN API KEY ABLY YANG SAMA DENGAN INDEX.HTML
        const ABLY_API_KEY = 'GANTI_DENGAN_API_KEY_ABLY_ANDA';
        
        const ably = new Ably.Realtime(ABLY_API_KEY);
        const channel = ably.channels.get('exam-room');
        const grid = document.getElementById('student-grid');
        
        // Simpan data siswa secara lokal
        const students = {};

        function createStudentCard(name) {
            const cardId = `student-${name.replace(/\s+/g, '-')}`;
            const card = document.createElement('div');
            card.id = cardId;
            card.className = "bg-white p-3 rounded shadow flex flex-col items-center transition-all duration-300 border-2 border-transparent";
            
            card.innerHTML = `
                <img id="img-${cardId}" src="https://via.placeholder.com/160x120?text=Menunggu+Kamera" class="w-full h-auto bg-gray-200 rounded mb-2">
                <h3 class="font-bold text-sm text-center truncate w-full" title="${name}">${name}</h3>
                <div class="flex justify-between w-full mt-2 text-xs">
                    <span class="text-gray-500">Pelanggaran:</span>
                    <span id="violation-${cardId}" class="font-bold text-red-600">0</span>
                </div>
            `;
            grid.appendChild(card);
            
            students[name] = { id: cardId, violations: 0, cardElement: card };
            return students[name];
        }

        channel.subscribe((message) => {
            const data = message.data;
            let student = students[data.name];
            
            // Jika siswa belum ada di grid, buat kartu baru
            if (!student) {
                student = createStudentCard(data.name);
            }

            if (message.name === 'snapshot') {
                // Perbarui foto wajah
                document.getElementById(`img-${student.id}`).src = data.image;
            } 
            else if (message.name === 'violation') {
                // Tambah angka pelanggaran
                student.violations++;
                document.getElementById(`violation-${student.id}`).innerText = student.violations;
                
                // Beri efek kedip merah pada kartu
                student.cardElement.classList.add('border-red-500', 'bg-red-50');
                setTimeout(() => {
                    student.cardElement.classList.remove('border-red-500', 'bg-red-50');
                }, 3000);
            }
        });
    </script>
</body>
</html>
