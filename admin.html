<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Ujian</title>
    <!-- Script diperbaiki: Menghapus format kurung siku yang salah -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        /* Font modern sehalus Windows (Segoe UI) */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Custom scrollbar untuk dashboard ala Windows */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-gray-100 to-gray-200 text-gray-800 min-h-screen p-4 md:p-6 transition-colors duration-500">

    <!-- LAYAR SETUP (Sebelum Ujian Dimulai) -->
    <div id="setup-screen" class="max-w-md mx-auto mt-12 transition-opacity duration-500">
        <div class="bg-white/80 backdrop-blur-xl p-8 rounded-2xl shadow-xl border border-white/60">
            
            <!-- Ikon Admin / Settings -->
            <div class="mx-auto w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-blue-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>

            <h2 class="text-2xl font-semibold mb-6 text-center tracking-tight">Setup Ruang Ujian</h2>
            
            <div class="mb-5">
                <label class="block text-gray-600 text-xs font-semibold mb-2 uppercase tracking-wide">Link Google Form Soal</label>
                <input id="setup-url" type="url" placeholder="https://docs.google.com/forms/..." 
                    class="w-full px-4 py-3 rounded-xl bg-white/60 border border-gray-300 placeholder-gray-400 text-gray-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-inner">
            </div>
            
            <div class="mb-8">
                <label class="block text-gray-600 text-xs font-semibold mb-2 uppercase tracking-wide">Buat Token Ujian</label>
                <input id="setup-token" type="text" placeholder="misal: IPA2026" 
                    class="w-full px-4 py-3 rounded-xl bg-white/60 border border-gray-300 placeholder-gray-400 text-gray-700 uppercase font-bold tracking-widest focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-inner">
            </div>
            
            <button id="start-session-btn" 
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-3 px-4 rounded-xl shadow-md hover:shadow-lg hover:shadow-blue-600/30 transition-all active:scale-[0.98]">
                Buka Ruang Ujian
            </button>
        </div>
    </div>

    <!-- LAYAR DASHBOARD (Saat Ujian Berlangsung) -->
    <div id="dashboard-screen" class="max-w-7xl mx-auto hidden opacity-0 transition-opacity duration-700">
        
        <!-- Header Dashboard bergaya Floating Card -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white/80 backdrop-blur-xl p-5 md:p-6 rounded-2xl shadow-sm border border-white/60">
            <div class="flex items-center gap-4">
                <div class="hidden md:flex w-10 h-10 bg-blue-100 rounded-full items-center justify-center text-blue-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight">Live Pengawas</h1>
                    <p class="text-xs md:text-sm text-gray-500 mt-0.5">Memantau ujian secara real-time</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-4 mt-4 md:mt-0">
                <div class="bg-gray-100/80 border border-gray-200 px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                    <span class="text-gray-500 font-medium">Token:</span>
                    <span id="display-token" class="font-bold text-blue-600 tracking-widest uppercase"></span>
                </div>
                
                <div class="bg-green-50 border border-green-100 text-green-700 px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-sm">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    Server Aktif
                </div>
            </div>
        </div>

        <!-- Grid Siswa -->
        <div id="student-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 pb-10">
            <!-- Kartu siswa akan muncul di sini otomatis -->
        </div>
    </div>

    <script>
        // API KEY ANDA SUDAH DIMASUKKAN DI SINI
        const ABLY_API_KEY = 'pXnEYQ.khrX9Q:CM3bJTJmtmAP84p9pmAuwcyIvTS_iQZJueh9gjav1p4';
        const ably = new Ably.Realtime(ABLY_API_KEY);
        // Memastikan nama channel sama persis dengan index.html
        const channel = ably.channels.get('Exam-proctoring');
        
        let activeUrl = "";
        let activeToken = "";
        const students = {};
        
        const setupScreen = document.getElementById('setup-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');

        // 1. Tombol Memulai Sesi
        document.getElementById('start-session-btn').addEventListener('click', () => {
            activeUrl = document.getElementById('setup-url').value.trim();
            activeToken = document.getElementById('setup-token').value.trim().toUpperCase();
            
            if(!activeUrl || !activeToken) return alert('Link soal dan Token harus diisi!');

            // Animasi transisi fade out setup, fade in dashboard
            setupScreen.style.opacity = '0';
            setTimeout(() => {
                setupScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                // Sedikit delay agar fade in terlihat
                setTimeout(() => {
                    dashboardScreen.style.opacity = '1';
                }, 50);
            }, 500);

            document.getElementById('display-token').innerText = activeToken;
            console.log("Ruang ujian dibuka dengan Token:", activeToken);
        });

        // 2. Menerima Permintaan Token dari Siswa
        channel.subscribe('join-request', (msg) => {
            const data = msg.data;
            console.log("Permintaan masuk dari:", data.name, "dengan Token:", data.token);
            
            // Jika token benar dan sesi sudah dibuka admin
            if (activeToken && data.token === activeToken) {
                // Balas ke siswa spesifik tersebut bahwa token benar + beri link soalnya
                channel.publish(`join-response-${data.clientId}`, { status: 'ok', url: activeUrl });
            } else {
                // Balas bahwa token salah / sesi belum dibuka
                channel.publish(`join-response-${data.clientId}`, { status: 'error', message: 'Token salah atau ujian belum dibuka guru.' });
            }
        });

        // 3. Menerima Foto dan Pelanggaran Siswa
        function getStudentCard(name) {
            const cardId = `student-${name.replace(/[^a-zA-Z0-9]/g, '-')}`;
            if (!students[name]) {
                const card = document.createElement('div');
                card.id = cardId;
                // Desain kartu siswa yang lebih modern
                card.className = "bg-white/90 backdrop-blur-sm p-3 rounded-2xl shadow-sm border border-gray-100 transition-all duration-500 flex flex-col items-center hover:shadow-md";
                
                // Link placeholder gambar diperbaiki
                card.innerHTML = `
                    <div class="relative w-full rounded-xl overflow-hidden mb-3 border border-gray-100 bg-gray-50 aspect-[4/3] flex items-center justify-center">
                        <img id="img-${cardId}" src="https://via.placeholder.com/160x120?text=Menghubungkan" class="w-full h-full object-cover absolute top-0 left-0 transition-opacity duration-300">
                    </div>
                    <h3 class="font-semibold text-gray-800 text-sm text-center truncate w-full px-1" title="${name}">${name}</h3>
                    
                    <div class="flex justify-between items-center w-full mt-3 px-2 text-xs bg-gray-50 rounded-lg p-2 border border-gray-100">
                        <span class="text-gray-500 font-medium">Pindah Tab:</span>
                        <span id="violation-${cardId}" class="font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded-md">0</span>
                    </div>
                `;
                document.getElementById('student-grid').appendChild(card);
                students[name] = { id: cardId, violations: 0, cardElement: card };
            }
            return students[name];
        }

        channel.subscribe('snapshot', (msg) => {
            const student = getStudentCard(msg.data.name);
            document.getElementById(`img-${student.id}`).src = msg.data.image;
        });

        channel.subscribe('violation', (msg) => {
            const student = getStudentCard(msg.data.name);
            student.violations++;
            document.getElementById(`violation-${student.id}`).innerText = student.violations;
            
            // Efek berkedip merah ala Windows saat ada pelanggaran
            student.cardElement.classList.add('ring-4', 'ring-red-500/40', 'bg-red-50/90', 'scale-105');
            setTimeout(() => {
                student.cardElement.classList.remove('ring-4', 'ring-red-500/40', 'bg-red-50/90', 'scale-105');
            }, 2500);
        });
    </script>
</body>
</html>
