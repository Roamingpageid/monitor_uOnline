<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Ujian</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://cdn.ably.com/lib/ably.min-1.js](https://cdn.ably.com/lib/ably.min-1.js)"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">

    <!-- LAYAR SETUP (Sebelum Ujian Dimulai) -->
    <div id="setup-screen" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Setup Ruang Ujian</h2>
        
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Link Google Form Soal:</label>
            <input id="setup-url" type="url" placeholder="[https://docs.google.com/forms/](https://docs.google.com/forms/)..." class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Buat Token Ujian:</label>
            <input id="setup-token" type="text" placeholder="misal: IPA2026" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
        </div>
        
        <button id="start-session-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Buka Ruang Ujian</button>
    </div>

    <!-- LAYAR DASHBOARD (Saat Ujian Berlangsung) -->
    <div id="dashboard-screen" class="max-w-7xl mx-auto hidden">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded shadow">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Live Pengawas</h1>
                <p class="text-sm text-gray-600 mt-1">Token Aktif: <span id="display-token" class="font-bold text-blue-600 text-lg"></span></p>
            </div>
            <div class="bg-green-100 text-green-800 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 mt-3 md:mt-0">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> Server Kelas Aktif
            </div>
        </div>

        <div id="student-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Kartu siswa akan muncul di sini otomatis -->
        </div>
    </div>

    <script>
        // API KEY ANDA SUDAH DIMASUKKAN DI SINI
        const ABLY_API_KEY = 'pXnEYQ.khrX9Q:CM3bJTJmtmAP84p9pmAuwcyIvTS_iQZJueh9gjav1p4';
        const ably = new Ably.Realtime(ABLY_API_KEY);
        const channel = ably.channels.get('exam-room');
        
        let activeUrl = "";
        let activeToken = "";
        const students = {};

        // 1. Tombol Memulai Sesi
        document.getElementById('start-session-btn').addEventListener('click', () => {
            activeUrl = document.getElementById('setup-url').value.trim();
            activeToken = document.getElementById('setup-token').value.trim().toUpperCase();
            
            if(!activeUrl || !activeToken) return alert('Link soal dan Token harus diisi!');

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            document.getElementById('display-token').innerText = activeToken;
            console.log("Ruang ujian dibuka dengan Token:", activeToken);
        });

        // 2. Menerima Permintaan Token dari Siswa
        channel.subscribe('join-request', (msg) => {
            const data = msg.data;
            console.log("Permintaan masuk dari:", data.name, "dengan Token:", data.token);
            
            // Jika token benar dan sesi sudah dibuka admin
            if (activeToken && data.token === activeToken) {
                // Balas ke siswa spesifik tersebut bahwa token benar + beri link soalnya
                channel.publish(`join-response-${data.clientId}`, { status: 'ok', url: activeUrl });
            } else {
                // Balas bahwa token salah / sesi belum dibuka
                channel.publish(`join-response-${data.clientId}`, { status: 'error', message: 'Token salah atau ujian belum dibuka guru.' });
            }
        });

        // 3. Menerima Foto dan Pelanggaran Siswa
        function getStudentCard(name) {
            const cardId = `student-${name.replace(/[^a-zA-Z0-9]/g, '-')}`;
            if (!students[name]) {
                const card = document.createElement('div');
                card.id = cardId;
                card.className = "bg-white p-3 rounded shadow flex flex-col items-center transition-all duration-300 border-2 border-transparent";
                card.innerHTML = `
                    <img id="img-${cardId}" src="[https://via.placeholder.com/160x120?text=Menghubungkan](https://via.placeholder.com/160x120?text=Menghubungkan)" class="w-full h-auto bg-gray-200 rounded mb-2">
                    <h3 class="font-bold text-sm text-center truncate w-full" title="${name}">${name}</h3>
                    <div class="flex justify-between w-full mt-2 text-xs">
                        <span class="text-gray-500">Pindah Tab:</span>
                        <span id="violation-${cardId}" class="font-bold text-red-600">0</span>
                    </div>
                `;
                document.getElementById('student-grid').appendChild(card);
                students[name] = { id: cardId, violations: 0, cardElement: card };
            }
            return students[name];
        }

        channel.subscribe('snapshot', (msg) => {
            const student = getStudentCard(msg.data.name);
            document.getElementById(`img-${student.id}`).src = msg.data.image;
        });

        channel.subscribe('violation', (msg) => {
            const student = getStudentCard(msg.data.name);
            student.violations++;
            document.getElementById(`violation-${student.id}`).innerText = student.violations;
            
            student.cardElement.classList.add('border-red-500', 'bg-red-50');
            setTimeout(() => student.cardElement.classList.remove('border-red-500', 'bg-red-50'), 3000);
        });
    </script>
</body>
</html>
